name: Starter checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install reviewed dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Check known dependency advisories
        run: npm audit --audit-level=high
      - name: Verify registry signatures and available provenance
        run: npm audit signatures
      - name: Type check and build
        run: npm run build
      - name: Verify planning exports
        run: python3 tools/preproduction/verify_package.py --exports
